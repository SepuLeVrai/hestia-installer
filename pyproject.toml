[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hestia-installer"
version = "0.1.0.dev0"
description = "HESTIA one-shot installer orchestrator"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["installer", "installer.modules"]
include-package-data = true

[tool.setuptools.package-data]
installer = ["web/*.html", "web/assets/*"]
