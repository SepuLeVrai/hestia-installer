name: Targeted HTTP drain validation

on:
  push:
    branches: ['work/phase5-http-drain-20260926']

permissions:
  contents: read

concurrency:
  group: targeted-http-drain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drain:
    name: HTTP drain only / Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze exact sources and run affected controller tests
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/hestia-drain-source" evidence
          git archive --format=tar HEAD > "$RUNNER_TEMP/hestia-drain-source.tar"
          tar -xf "$RUNNER_TEMP/hestia-drain-source.tar" -C "$RUNNER_TEMP/hestia-drain-source"
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse HEAD^{tree} > evidence/tree.txt
          sha256sum "$RUNNER_TEMP/hestia-drain-source.tar" > evidence/source-archive.txt
          docker build --build-arg DEBIAN=13 \
            -f "$RUNNER_TEMP/hestia-drain-source/tests/integration/Dockerfile.systemd" \
            -t hestia-http-drain "$RUNNER_TEMP/hestia-drain-source"
      - name: Boot disposable isolated systemd
        run: |
          set -Eeuo pipefail
          docker run -d --name hestia-http-drain --network none --privileged \
            --cgroupns=private --tmpfs /run --tmpfs /run/lock --tmpfs /tmp hestia-http-drain
          ready=false
          for attempt in $(seq 1 60); do
            state=$(docker exec hestia-http-drain systemctl is-system-running 2>/dev/null || true)
            if [ "$state" = running ] || [ "$state" = degraded ]; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec hestia-http-drain cat /etc/os-release > evidence/environment.txt
          docker exec hestia-http-drain systemctl --version >> evidence/environment.txt
          docker exec hestia-http-drain php --version >> evidence/environment.txt
          docker exec hestia-http-drain apache2 -v >> evidence/environment.txt
          docker inspect --format '{{json .NetworkSettings.Networks}}' hestia-http-drain > evidence/network.json
      - name: Test affected private controllers in the same exact source
        run: |
          set -Eeuo pipefail
          docker exec -w /opt/hestia-installer -e PYTHONPATH=tests hestia-http-drain \
            python3 -m unittest test_http_drain test_http_runtime test_system_drain test_session_cleaner -v \
            2>&1 | tee evidence/controllers.log
      - name: Test HTTP multipart, descendants, foreign writers and controller death
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_HTTP_RUNTIME_TEST=1 hestia-http-drain \
            python3 /opt/hestia-installer/tests/integration/http_runtime_systemd.py \
            --report /evidence/http-runtime.json 2>&1 | tee evidence/http-runtime.log
      - name: Keep existing cgroup and session collector contracts covered
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SYSTEMD_DRAIN_TEST=1 hestia-http-drain \
            python3 /opt/hestia-installer/tests/integration/system_drain_systemd.py \
            --report /evidence/system-drain.json 2>&1 | tee evidence/system-drain.log
          docker exec -e HESTIA_SESSION_CLEANER_TEST=1 hestia-http-drain \
            python3 /opt/hestia-installer/tests/integration/session_cleaner_systemd.py \
            --report /evidence/session-cleaner.json 2>&1 | tee evidence/session-cleaner.log
      - name: Preserve evidence and remove disposable container
        if: always()
        run: |
          docker cp hestia-http-drain:/evidence/. evidence/ || true
          docker logs --tail 100 hestia-http-drain > evidence/boot.log 2>&1 || true
          docker rm -f hestia-http-drain || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: http-drain-targeted-debian13
          path: evidence/
          if-no-files-found: error
          retention-days: 7
