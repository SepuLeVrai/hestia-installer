name: Prepare exact Installer 5B2.2 objects
on:
  push:
    branches: ['verification/5b22-installer-step1-20260924']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reconstruct exact test correction and create unattached blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path
          blob=base64.b64decode(Path('.quality/5b22/responsive.b64').read_text(),validate=True)
          assert hashlib.sha256(blob).hexdigest()=='b3b6ab35ba408a86a84601e4881d86ef6890308c7efc75fb1e2d31b2c8a7b869'
          raw=lzma.decompress(blob,memlimit=268435456);assert len(raw)<50000
          v=json.loads(raw)
          assert set(v)=={'base','tree','files'}
          assert v['base']=='e5ae0dfa57d600a443985efe9105da49a7c03ca9'
          assert v['tree']=='4c2a10909d6e75b86b898313105894f2a0cfcbe7'
          assert set(v['files'])=={'tests/browser_wizard.py','docs/QUALITY.md','docs/HANDOFF_WORK_20260925.md'}
          root=Path(os.environ['RUNNER_TEMP'])/'responsive-correction'
          subprocess.run(['git','worktree','add','--detach',str(root),v['base']],check=True)
          entries=[]
          for name,item in v['files'].items():
              assert item['mode']=='100644'
              path=root/name;old=path.read_bytes();assert hashlib.sha256(old).hexdigest()==item['base_sha256']
              text=old.decode('utf-8')
              for start,end,new in reversed(item['edits']):
                  assert 0<=start<=end<=len(text)
                  text=text[:start]+new+text[end:]
              data=text.encode('utf-8');path.write_bytes(data);path.chmod(0o644)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['sha']
              entries.append({'path':name,'mode':'100644','type':'blob','sha':item['sha']})
          subprocess.run(['git','-C',str(root),'add','--',*v['files']],check=True)
          assert subprocess.check_output(['git','-C',str(root),'write-tree'],text=True).strip()==v['tree']
          for entry in entries:
              request=urllib.request.Request('https://api.github.com/repos/SepuLeVrai/hestia-installer/git/blobs',
                  json.dumps({'encoding':'utf-8','content':(root/entry['path']).read_text(encoding='utf-8')}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','User-Agent':'HESTIA-source-qualification'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read(1048577);assert len(data)<=1048576
                  assert json.loads(data)['sha']==entry['sha']
          Path('evidence').mkdir();Path('evidence/objects.json').write_text(json.dumps({'tree':v['tree'],'entries':entries},indent=2))
          print('Exact test correction prepared; no branch updated. Full requalification required.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase5b22-installer-objects
          path: evidence/
          retention-days: 1
          if-no-files-found: error
