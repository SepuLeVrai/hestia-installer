name: Installer baseline verification
on:
  push:
    branches: [test/installer-quality-20260924]
permissions:
  contents: read
concurrency:
  group: installer-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: Phase 4 baseline / Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:13-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Install quality tools in disposable Debian
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv nodejs chromium openssl iproute2
          python3 -m venv /opt/quality-venv
          /opt/quality-venv/bin/pip install 'playwright==1.57.0'
          echo /opt/quality-venv/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Snapshot the published baseline for reproducibility
        run: |
          set -Eeuo pipefail
          mkdir -p quality-results
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = 2d86b36da536f118ae5dbb79ddbba663644cf18f
          git archive --format=tar.gz 2d86b36da536f118ae5dbb79ddbba663644cf18f > quality-results/baseline-source.tar.gz
          sha256sum quality-results/baseline-source.tar.gz > quality-results/SHA256SUMS
          python3 --version > quality-results/environment.txt
          chromium --version >> quality-results/environment.txt
          node --version >> quality-results/environment.txt
          pip freeze >> quality-results/environment.txt
          git ls-tree -r HEAD > quality-results/git-tree.txt
      - name: Replay historical quality without modifying its tests
        run: |
          set -Eeuo pipefail
          ./scripts/quality-wizard.sh 2>&1 | tee quality-results/baseline.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installer-phase4-baseline
          path: quality-results/
          if-no-files-found: error
          retention-days: 7
