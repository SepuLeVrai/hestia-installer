name: Installer system runtime Quality

on:
  push:
    branches: [main, 'quality/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-system-runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  systemd:
    name: Real systemd Apache FPM / Debian ${{ matrix.debian }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build disposable PID-1 systemd from official Debian packages
        env:
          DEBIAN_VERSION: ${{ matrix.debian }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/hestia-system-source" evidence
          git archive --format=tar HEAD > "$RUNNER_TEMP/hestia-system-source.tar"
          tar -xf "$RUNNER_TEMP/hestia-system-source.tar" -C "$RUNNER_TEMP/hestia-system-source"
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse HEAD^{tree} > evidence/tree.txt
          sha256sum "$RUNNER_TEMP/hestia-system-source.tar" > evidence/source-archive.txt
          docker build --build-arg "DEBIAN=$DEBIAN_VERSION" \
            -f "$RUNNER_TEMP/hestia-system-source/tests/integration/Dockerfile.systemd" \
            -t hestia-system-runtime "$RUNNER_TEMP/hestia-system-source"
      - name: Boot isolated systemd with its own writable cgroup namespace
        run: |
          set -Eeuo pipefail
          # Only this disposable runner/container. No host cgroup bind mount,
          # repository credentials, exposed port, or production endpoint.
          docker run -d --name hestia-system-runtime --network none --privileged \
            --cgroupns=private --tmpfs /run --tmpfs /run/lock --tmpfs /tmp hestia-system-runtime
          ready=false
          for attempt in $(seq 1 60); do
            state=$(docker exec hestia-system-runtime systemctl is-system-running 2>/dev/null || true)
            if [ "$state" = running ] || [ "$state" = degraded ]; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec hestia-system-runtime cat /etc/os-release > evidence/environment.txt
          docker exec hestia-system-runtime systemctl --version >> evidence/environment.txt
          docker exec hestia-system-runtime php --version >> evidence/environment.txt
          docker exec hestia-system-runtime apache2 -v >> evidence/environment.txt
      - name: Exercise real admission, cgroups, crash recovery and closed refusals
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SYSTEMD_DRAIN_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/system_drain_systemd.py \
            --report /evidence/system-drain.json 2>&1 | tee evidence/system-drain.log
      - name: Exercise generated dedicated runtime, permissions and closed staging
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_HTTP_RUNTIME_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/http_runtime_systemd.py \
            --report /evidence/http-runtime.json 2>&1 | tee evidence/http-runtime.log
      - name: Exercise dedicated session collector and unchanged native cleaner
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SESSION_CLEANER_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/session_cleaner_systemd.py \
            --report /evidence/session-cleaner.json 2>&1 | tee evidence/session-cleaner.log
      - name: Observe provisioned units without controlling them
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SYSTEMD_OBSERVATIONS_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/systemd_observations_systemd.py \
            --report /evidence/systemd-observations.json 2>&1 | tee evidence/systemd-observations.log
      - name: Discover manager populations without loading or controlling units
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SYSTEMD_DISCOVERY_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/systemd_discovery_systemd.py \
            --report /evidence/systemd-discovery.json 2>&1 | tee evidence/systemd-discovery.log
      - name: Bind PIDFD invocations without named-unit autoload (supported profile)
        if: matrix.debian == '13'
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SYSTEMD_DISCOVERY_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/systemd_invocation_systemd.py \
            --report /evidence/systemd-invocation.json 2>&1 | tee evidence/systemd-invocation.log
      - name: Observe invocation names and relations (supported profile)
        if: matrix.debian == '13'
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SYSTEMD_DISCOVERY_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/systemd_invocation_relations_systemd.py \
            --report /evidence/systemd-invocation-relations.json 2>&1 | tee evidence/systemd-invocation-relations.log
      - name: Observe real credentials, namespaces and process races
        if: matrix.debian == '13'
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SYSTEMD_DISCOVERY_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/process_identity_systemd.py \
            --report /evidence/process-identity.json 2>&1 | tee evidence/process-identity.log
      - name: Exercise exclusive service identity and actual runtime consumption
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_SERVICE_IDENTITY_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/service_identity_systemd.py \
            --report /evidence/service-identity.json 2>&1 | tee evidence/service-identity.log
      - name: Exercise declared proxy, separate client allowlist and real TLS
        run: |
          set -Eeuo pipefail
          docker exec -e HESTIA_PROXY_INGRESS_TEST=1 hestia-system-runtime \
            python3 /opt/hestia-installer/tests/integration/proxy_ingress_systemd.py \
            --report /evidence/proxy-ingress.json 2>&1 | tee evidence/proxy-ingress.log
      - name: Preserve non-secret evidence and remove disposable container
        if: always()
        run: |
          docker cp hestia-system-runtime:/evidence/. evidence/ || true
          docker logs --tail 100 hestia-system-runtime > evidence/boot.log 2>&1 || true
          docker exec hestia-system-runtime journalctl -b -p warning --no-pager -n 150 > evidence/systemd-warnings.log 2>&1 || true
          docker rm -f hestia-system-runtime || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installer-system-runtime-debian-${{ matrix.debian }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
